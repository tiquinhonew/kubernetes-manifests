apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finances
  namespace: argocd
spec:
  destination:
    namespace: finances
    server: https://kubernetes.default.svc
  project: default
  source:
    path: applications/finances
    repoURL: https://github.com/tiquinhonew/kubernetes-manifests.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
